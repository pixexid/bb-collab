name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification
        run: npm exec --yes --package=bb-app@0.37.0 -- npm run verify
      - name: Check BB plugin types
        run: npm exec --yes --package=bb-app@0.37.0 -- bb plugin types --check
      - name: Check pull-request review tier
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -o pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | node scripts/check-review-tier.mjs "$GITHUB_EVENT_PATH"
      - name: Check pull-request lifecycle linkage
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-lifecycle.mjs "$GITHUB_EVENT_PATH"
